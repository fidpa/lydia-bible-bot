name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Not --frozen-lockfile: bun.lock still pins the pre-1.3.0 agent SDK,
      # so a frozen install fails until the lockfile is refreshed.
      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Bundle entry points
        run: |
          bun build src/index.ts ask_user_mcp/server.ts scripts/export-chat.ts \
            --target=bun --outdir "$RUNNER_TEMP/build"
